<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema" aria-pressed="false">☀️ Claro</button>
    <h1 class="title">TETRIS</h1>
    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label" id="mode-name">MARATÓN</span>
          <span class="mode-hud" id="mode-hud"></span>
        </div>
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>

        <div class="panel-section" id="energy-section">
          <span class="label">ENERGY <kbd>E</kbd></span>
          <div id="energy-bar"><div id="energy-fill"></div></div>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd>/<kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>M</kbd> sonido <span id="mute-state">on</span></li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div id="ability-box" class="overlay-box"></div>
    </div>

    <div id="menu" class="overlay">
      <div class="overlay-box">
        <p class="menu-title">MODO DE JUEGO</p>
        <div id="menu-list"></div>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="menu-btn">Menú</button>
      </div>
    </div>
    </div>
  </div>

  <script src="pieces.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
  <script src="scoring.js"></script>
  <script src="powerups.js"></script>
  <script src="abilities.js"></script>
  <script src="challenges.js"></script>
  <script src="main.js"></script>
</body>
</html>
